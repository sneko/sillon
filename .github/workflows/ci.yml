name: Continuous Integration
on:
  push:
    branches:
      - original
  pull_request:
env:
  APP_NAME: sillon
  CONTAINER_REGISTRY: ghcr.io
  CONTAINER_IMAGE_FOLDER: ghcr.io/${{ github.repository }}
  NODE_OPTIONS: --max_old_space_size=4096
  NODE_VERSION: 18.16.0
  NPM_VERSION: 9.5.1
concurrency:
  # Prevent parallel builds of the same branch
  group: cicd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  requirements:
    name: Continuous Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Adjust npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - uses: actions/cache@v3
        name: Setup npm cache
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-store-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-store-

      - name: Install dependencies
        run: make deps

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Build
        env:
          CRISP_WEBSITE_ID: ${{ secrets.CRISP_WEBSITE_ID }}
        run: make build

      - name: Install PDF tool
        # [WORKAROUND] It should have worked by using it inside a Docker container but something is broken
        # Ref: https://github.com/signcl/docusaurus-prince-pdf/issues/34
        run: |
          curl https://www.princexml.com/download/prince-14.2-linux-generic-x86_64.tar.gz -O
          tar zxf prince-14.2-linux-generic-x86_64.tar.gz
          cd prince-14.2-linux-generic-x86_64
          yes "" | sudo ./install.sh

      - name: Generate PDF
        run: make generate-pdf-in-ci

      - name: Set up Docker buildx
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/original' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/original' }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the application Docker image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/original' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.CONTAINER_IMAGE_FOLDER }}/${{ env.APP_NAME }}-${{ github.ref_name }}:${{ github.sha }},${{ env.CONTAINER_IMAGE_FOLDER }}/${{ env.APP_NAME }}-${{ github.ref_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Coolify
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/original' }}
        run: |
          curl --fail-with-body --request POST '${{ secrets.COOLIFY_CORE_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_CORE_TOKEN }}'
